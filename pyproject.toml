[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolineras"
version = "0.1.0"
description = "Mapa unificado de electrolineras en la península ibérica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "lxml>=5.3",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
electrolineras-api = "api.main:run"
electrolineras-fetch-es = "ingest.fetch_spain:main"
electrolineras-fetch-pt = "ingest.fetch_portugal:main"
electrolineras-parse-datex = "ingest.datex_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: pruebas que acceden a la red (feed NAP real)",
]
addopts = "-m 'not integration'"
