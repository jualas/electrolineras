app:
  description: 'Guía de viaje EV: motor Electrolineras (JSON) + narrativa vía cursor-cli-bridge
    (sin OpenAI en Dify). Entradas trip_context_json + agent_summary. Salida guide_text.
    Requiere puente en http://<IP-LAN-SERVIDOR>:18765/invoke — ver scripts/dify/run_cursor_bridge.sh'
  icon: ⚡
  icon_background: '#FEF3C7'
  icon_type: emoji
  mode: workflow
  name: Electrolineras — guía de viaje EV
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: el-e1
      source: el-start
      sourceHandle: source
      target: el-invoke
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: el-e2
      source: el-invoke
      sourceHandle: source
      target: el-end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: Variables desde Electrolineras API (trip-guide-from-car).
        selected: false
        title: Start
        type: start
        variables:
        - label: trip_context_json
          max_length: 50000
          options: []
          required: true
          type: paragraph
          variable: trip_context_json
        - label: agent_summary
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: agent_summary
      height: 140
      id: el-start
      position:
        x: 80
        y: 260
      positionAbsolute:
        x: 80
        y: 260
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\nimport urllib.request\n\nBRIDGE_URL = \"http://<IP-LAN-SERVIDOR>:18765/invoke\"\
          \n\n\ndef main(trip_context_json: str = \"\", agent_summary: str = \"\") ->\
          \ dict:\n    payload = json.dumps(\n        {\n            \"trip_context_json\"\
          : trip_context_json or \"\",\n            \"agent_summary\": agent_summary\
          \ or \"\",\n        }\n    ).encode(\"utf-8\")\n    req = urllib.request.Request(\n\
          \        BRIDGE_URL,\n        data=payload,\n        headers={\"Content-Type\"\
          : \"application/json\"},\n        method=\"POST\",\n    )\n    try:\n     \
          \   with urllib.request.urlopen(req, timeout=600) as resp:\n            raw\
          \ = resp.read().decode(\"utf-8\", errors=\"replace\")\n        data = json.loads(raw)\
          \ if raw else {}\n    except Exception as e:\n        return {\"guide_text\"\
          : f\"(Error puente Cursor: {e})\"}\n    if not isinstance(data, dict):\n \
          \       return {\"guide_text\": str(data)[:50000]}\n    out = data.get(\"output\"\
          )\n    if isinstance(out, str) and out.strip():\n        return {\"guide_text\"\
          : out.strip()}\n    err = data.get(\"error\") or data.get(\"stderr\")\n   \
          \ return {\"guide_text\": f\"(Error puente Cursor: {err or 'sin output'})\"\
          }\n"
        code_language: python3
        desc: POST al cursor-cli-bridge con trip_context_json + agent_summary (evita bug
          de variables en nodo HTTP).
        outputs:
          guide_text:
            children: null
            type: string
        selected: false
        title: Invoke Cursor bridge
        type: code
        variables:
        - value_selector:
          - el-start
          - trip_context_json
          variable: trip_context_json
        - value_selector:
          - el-start
          - agent_summary
          variable: agent_summary
      height: 95
      id: el-invoke
      position:
        x: 360
        y: 260
      positionAbsolute:
        x: 360
        y: 260
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        outputs:
        - value_selector:
          - el-invoke
          - guide_text
          value_type: string
          variable: guide_text
        selected: false
        title: End
        type: end
      height: 90
      id: el-end
      position:
        x: 640
        y: 260
      positionAbsolute:
        x: 640
        y: 260
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 0.85
  rag_pipeline_variables: []
