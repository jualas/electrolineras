services:
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: electrolineras-osrm-car
    # On-demand: el host lifecycle arranca/para; no revivir tras reboot del PC.
    restart: "no"
    ports:
      - "${OSRM_CAR_PORT:-127.0.0.1:5000:5000}"
    volumes:
      - ${OSRM_DATA_DIR:-/mnt/datos/docker/volumes/osrm-iberia}/car:/data:ro
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/iberia-latest.osrm
    healthcheck:
      # La imagen osrm-backend no trae wget/curl: sonda HTTP cruda vía /dev/tcp de bash (sí presente).
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/5000; printf 'GET /route/v1/car/-3.7038,40.4168;-0.3763,39.4699?overview=false HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; timeout 5 head -1 <&3 | grep -q 200\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Carga del grafo Iberia: unhealthy al inicio es normal
      start_period: 600s

  osrm-shortest:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: electrolineras-osrm-shortest
    restart: "no"
    ports:
      - "${OSRM_SHORTEST_PORT:-127.0.0.1:5001:5000}"
    volumes:
      - ${OSRM_DATA_DIR:-/mnt/datos/docker/volumes/osrm-iberia}/shortest:/data:ro
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/iberia-latest.osrm
    healthcheck:
      # La imagen osrm-backend no trae wget/curl: sonda HTTP cruda vía /dev/tcp de bash (sí presente).
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/5000; printf 'GET /route/v1/shortest/-3.7038,40.4168;-0.3763,39.4699?overview=false HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; timeout 5 head -1 <&3 | grep -q 200\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
