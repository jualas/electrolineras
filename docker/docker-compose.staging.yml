# Electrolineras — stack STAGING (pruebas antes de prod)
#
# Paralelo a docker-compose.prod.yml. No toca :8015 ni electro.jualas.es.
#
#   Puerto: 8016
#   Contenedores: electrolineras-staging-api / electrolineras-staging-nginx
#   Datos: volumen propio (copia de stations.db; ver docs/STAGING.md)
#   OSRM / Nominatim: mismos servicios que prod (red osrm_default + host)
#
# Uso rápido:
#   make deploy-staging
#   curl -s http://127.0.0.1:8016/health

name: electrolineras-staging

services:
  electrolineras-staging-api:
    build:
      context: ${ELECTROLINERAS_SRC:-/mnt/datos/Proyectos/Electrolineras}
      dockerfile: docker/Dockerfile.api
    image: electrolineras-api:staging
    container_name: electrolineras-staging-api
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: sqlite:////app/data/db/stations.db
      SERVE_WEB_STATIC: "false"
      API_RELOAD: "false"
      API_ENVIRONMENT: staging
      API_RATE_LIMIT_ENABLED: "true"
      API_TRUST_PROXY_HEADERS: "true"
      # Docs útiles en staging; cerradas en prod
      API_DOCS_ENABLED: "true"
      # Staging se sirve por HTTP (:8016 / LAN). Secure=true impide guardar la cookie.
      SESSION_COOKIE_SECURE: "false"
      API_CORS_ORIGINS: >-
        https://electro-test.jualas.es,
        http://127.0.0.1:8016,
        http://<IP-LAN-SERVIDOR>:8016,
        http://127.0.0.1:5173,
        http://localhost:5173
    expose:
      - "8000"
    volumes:
      - ${ELECTROLINERAS_STAGING_DATA:-/mnt/datos/docker/volumes/electrolineras-staging-data}:/app/data
    networks:
      default:
        aliases:
          # Misma conf nginx que prod (upstream electrolineras-api)
          - electrolineras-api
      osrm: {}
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  electrolineras-staging-nginx:
    build:
      context: ${ELECTROLINERAS_SRC:-/mnt/datos/Proyectos/Electrolineras}
      dockerfile: docker/Dockerfile.nginx
    image: electrolineras-nginx:staging
    container_name: electrolineras-staging-nginx
    restart: unless-stopped
    ports:
      - "${ELECTROLINERAS_STAGING_PORT:-0.0.0.0:8016:80}"
    depends_on:
      electrolineras-staging-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  osrm:
    external: true
    name: osrm_default
